# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

[[repos]]
repo = "https://github.com/gitleaks/gitleaks"
rev = "v8.30.0"
hooks = [{ id = "gitleaks-system", pass_filenames = false }]

[[repos]]
repo = "https://github.com/compilerla/conventional-pre-commit"
rev = "v4.2.0"
hooks = [
  { id = "conventional-pre-commit", stages = ["commit-msg"], args = [
    "feat", "fix", "chore", "refactor", "docs", "style", "test", "ci", "build", "perf",
  ] },
]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "require-tag-and-changelog"
name = "Require version tag and changelog entry on push to main"
entry = "setup/hooks/pre-push-main-guard.sh"
language = "script"
always_run = true
pass_filenames = false
stages = ["pre-push"]

[[repos.hooks]]
id = "codex-config-drift"
name = "Detect drift in ~/.codex/config.toml vs dotfiles base"
entry = "setup/hooks/codex-config-drift.sh"
language = "script"
always_run = true
pass_filenames = false
stages = ["pre-commit"]
