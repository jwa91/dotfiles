"$schema" = 'https://starship.rs/config-schema.json'

# Stripped-down prompt for terminals that miscalculate Nerd Font glyph widths.
# Opt in with: export STARSHIP_CONFIG="$CONFIG_DIR/starship-mobile.toml"

format = """
$directory\
$git_branch\
$git_status\
$line_break$character"""

palette = 'gruvbox_dark'

[palettes.gruvbox_dark]
color_fg0 = '#fbf1c7'
color_bg0 = '#282828'
color_bg1 = '#3c3836'
color_bg3 = '#665c54'
color_blue = '#458588'
color_aqua = '#689d6a'
color_green = '#98971a'
color_orange = '#d65d0e'
color_purple = '#b16286'
color_red = '#cc241d'
color_yellow = '#d79921'

[directory]
style = "bold fg:color_yellow"
format = '[$path]($style) '
truncation_length = 3
truncation_symbol = ".../"

[git_branch]
symbol = ""
style = "fg:color_aqua"
format = '[$branch]($style)'

[git_status]
style = "fg:color_aqua"
format = '[$all_status$ahead_behind]($style) '

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[>](bold fg:color_green)'
error_symbol = '[>](bold fg:color_red)'
vimcmd_symbol = '[<](bold fg:color_green)'
