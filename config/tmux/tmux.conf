# ----------------------------------------
# tmux configuration
# Phase 1: session persistence, copy-mode, device-swapping
# ----------------------------------------

# --- Prefix ---
# ctrl-space (no conflicts with shell, Ghostty, or Raycast hyperkeys)
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# --- Environment passthrough ---
# tmux overrides TERM_PROGRAM; set OUTER_TERM so .zshenv knows
# what launched the server. Hardcoded to ghostty since tmux is only
# started locally from Ghostty. Mobile attach detection is a TODO.
set-environment -g OUTER_TERM ghostty

# --- Basics ---
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g history-limit 50000
set -sg escape-time 10
setw -g aggressive-resize on
set -g status-interval 5
set -g renumber-windows on

# --- Copy mode (vi keys) ---
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"

# --- Session switching ---
# prefix + s  = built-in session picker (default, no bind needed)
# prefix + w  = built-in window/session tree (default, no bind needed)

# --- Quick reload ---
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"
