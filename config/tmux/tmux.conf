# ----------------------------------------
# tmux configuration — optimized for remote/mobile access
# ----------------------------------------

# Mouse support (essential for phone touch interaction)
set -g mouse on

# Start windows and panes at 1 (easier to reach on phone keyboard)
set -g base-index 1
setw -g pane-base-index 1

# Generous scrollback
set -g history-limit 50000

# Low escape delay (responsive over SSH/mosh)
set -sg escape-time 10

# Resize based on smallest *active* client, not smallest attached
setw -g aggressive-resize on

# Status bar update frequency
set -g status-interval 5
