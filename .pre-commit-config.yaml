repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks-system
        pass_filenames: false

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.2.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args:
          - feat
          - fix
          - chore
          - refactor
          - docs
          - style
          - test
          - ci
          - build
          - perf

  - repo: local
    hooks:
      - id: require-tag-and-changelog
        name: Require version tag and changelog entry on push to main
        entry: setup/hooks/pre-push-main-guard.sh
        language: script
        always_run: true
        pass_filenames: false
        stages: [pre-push]
